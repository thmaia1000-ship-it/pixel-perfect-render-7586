# Configuração para Google Firebase App Hosting / Google Cloud
# Documentação: https://firebase.google.com/docs/app-hosting/configure

service:
  # Ambiente de execução Node.js / Bun
  runtime: nodejs20

# Configuração de recursos de computação no Google Cloud
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Variáveis de ambiente injetadas no Cloud Run / App Hosting
env:
  - variable: NODE_ENV
    value: production
  - variable: NITRO_PRESET
    value: node-server
  - variable: PORT
    value: "8080"
  - variable: VITE_SUPABASE_URL
    availability:
      - RUNTIME
      - BUILD
  - variable: VITE_SUPABASE_ANON_KEY
    availability:
      - RUNTIME
      - BUILD
  - variable: GEMINI_API_KEY
    availability:
      - RUNTIME
